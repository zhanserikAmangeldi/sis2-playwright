# Copy of _docker/vhost.conf from github.com/testsmith-io/practice-software-testing.
# Their prebuilt "web" image is arm64-only, so CI runs the official multi-arch nginx with this file.
server {
    listen 80;
    index index.php index.html;
    root /var/www/public;
    server_tokens off;

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel-api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
